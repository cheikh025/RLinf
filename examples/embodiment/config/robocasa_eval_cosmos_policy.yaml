# robocasa_eval_cosmos_policy.yaml
# Eval-only run of NVIDIA Cosmos Policy on RoboCasa, wired natively into RLinf.
# Run: bash examples/embodiment/eval_embodiment.sh robocasa_eval_cosmos_policy
# Starts with 1 task (CloseDrawer); expand env.eval.task_names once the smoke passes.

defaults:
  - env/robocasa_closedrawer@env.train
  - env/robocasa_closedrawer@env.eval
  - model/cosmos_policy_robocasa_2b@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # `actor` must be declared even for only_eval: validate_cfg computes
    # actor_world_size from the placement. eval_embodied_agent.py only launches
    # the rollout + env worker groups, so no actor worker is actually created.
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa_eval_cosmos_policy"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null   # do NOT load an RLinf .pt; Cosmos loads from actor.model.model_path

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1   # must be > 0 for only_eval
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  gamma: 0.99
  gae_lambda: 0.95
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  # Cosmos RoboCasa contract: 3 camera views, 7D action, 224x224.
  # max_steps_per_rollout_epoch should be a multiple of num_action_chunks (16).
  train:
    image_space: 3views
    action_space: 7d
    state_space: 25d
    total_num_envs: 8
    group_size: 1
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    init_params:
      camera_heights: 224
      camera_widths: 224

  eval:
    image_space: 3views
    action_space: 7d
    state_space: 25d
    total_num_envs: 8
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    init_params:
      camera_heights: 224
      camera_widths: 224
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  enable_torch_compile: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0
  enable_offload: False

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
