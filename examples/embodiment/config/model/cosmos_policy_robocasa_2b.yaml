# cosmos_policy_robocasa_2b.yaml
# NVIDIA Cosmos Policy RoboCasa (Predict2-2B), eval-only wrapper for RLinf.
# Defaults mirror NVIDIA's official RoboCasa inference config; the only override
# vs upstream is flip_images=False (RLinf's RobocasaEnv already flips upright).
# See dreamzero_docs/robocasa_cosmos_rlinf_integration_plan_README.md.

model_type: "cosmos_policy"
precision: bf16
model_path: nvidia/Cosmos-Policy-RoboCasa-Predict2-2B  # HF repo or local ckpt dir

is_lora: False
# Cosmos get_model() places the model on device itself; skip RLinf's generic .to().
load_to_device: False

# RLinf execution contract
action_dim: 7
num_action_chunks: 16   # executed open-loop steps (first 16 of the 32 generated)

# Cosmos experiment selection
cosmos_config: cosmos_predict2_2b_480p_robocasa_50_demos_per_task__inference
cosmos_config_file: cosmos_policy/config/config.py

# Normalization + text embedding assets (ship in the HF checkpoint repo).
# TODO(verify): confirm whether cosmos load_dataset_stats / T5 init resolve these
# HF-relative paths or require local files; if local, point at the downloaded ckpt.
dataset_stats_path: nvidia/Cosmos-Policy-RoboCasa-Predict2-2B/robocasa_dataset_statistics.json
t5_text_embeddings_path: nvidia/Cosmos-Policy-RoboCasa-Predict2-2B/robocasa_t5_embeddings.pkl

# Diffusion / IO knobs (match training/eval; passed through to PolicyEvalConfig)
chunk_size: 32
num_denoising_steps_action: 5
num_denoising_steps_future_state: 1
num_denoising_steps_value: 1
use_wrist_image: True
num_wrist_images: 1
use_proprio: True
normalize_proprio: True
unnormalize_actions: True
trained_with_image_aug: True
use_jpeg_compression: True
flip_images: False           # OVERRIDE: env already returns upright frames
deterministic: True
use_variance_scale: False
num_queries_best_of_n: 1     # N=1 baseline; best-of-N is a later milestone
seed: 195
